.n{animation:pulse 2.8s ease-in-out infinite}
.cur{animation:blink 1s step-end infinite}
.r1{animation:rise .9s ease-out both}
.r2{animation:rise .9s ease-out .25s both}
.r3{animation:rise .9s ease-out .5s both}
.r4{animation:rise .9s ease-out .75s both}
</style>
